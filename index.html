<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' https: data:; connect-src 'self' https://api.open-meteo.com https://geocoding-api.open-meteo.com https://ipwho.is https://freeipapi.com https://ipapi.co https://api.unsplash.com https://picsum.photos https://images.unsplash.com; object-src 'none';">
    <title>New Tab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&family=Playfair+Display:wght@700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: white;
            font-family: 'Inter', sans-serif;
            height: 100vh;
            width: 100vw;
        }

        #bg-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-size: cover;
            background-position: center;
            transition: opacity 1.5s ease-in-out;
            z-index: -2;
            opacity: 0;
        }

        #scrim {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0,0,0,0) 0%, rgba(0,0,0,0.4) 100%),
                        linear-gradient(0deg, rgba(0,0,0,0.2) 0%, rgba(0,0,0,0) 50%, rgba(0,0,0,0.2) 100%);
            z-index: -1;
        }

        .glass {
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .hidden-ui {
            opacity: 1;
            pointer-events: auto;
            transition: opacity 0.4s ease;
        }

        body.ui-hidden .hidden-ui {
            opacity: 0 !important;
            pointer-events: none !important;
        }

        .setting-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
        }

        input, select {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.2);
            color: white;
            padding: 4px 8px;
            border-radius: 6px;
            outline: none;
            font-size: 0.875rem;
        }

        input:focus { border-color: rgba(255,255,255,0.5); }

        #clock {
            text-shadow: 0 4px 20px rgba(0,0,0,0.4);
            letter-spacing: -0.02em;
        }

        #quote-container {
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
        }

        .loader {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(255,255,255,0.2);
            border-top: 2px solid white;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            display: none;
        }

        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="bg-overlay"></div>
    <div id="scrim"></div>

    <!-- Top Widgets Bar (Responsive for Mobile and Desktop) -->
    <div class="fixed top-4 left-4 right-4 md:top-6 md:left-6 md:right-6 flex flex-col md:flex-row justify-between items-stretch md:items-start gap-3 z-10 pointer-events-none">
        <!-- Wiktionary Word of the Day Widget -->
        <div id="wotd-widget" class="hidden-ui pointer-events-auto glass p-3 md:p-4 rounded-2xl flex flex-col gap-1 text-sm hidden w-full md:w-auto md:max-w-xs">
            <div class="flex items-center justify-between text-xs opacity-70 mb-1">
                <span class="font-medium tracking-wide uppercase text-[10px]">Word of the Day</span>
                <a id="wotd-link" href="https://en.wiktionary.org/wiki/Wiktionary:Word_of_the_day" target="_blank" rel="noopener" class="hover:underline opacity-80">Wiktionary ↗</a>
            </div>
            <div id="wotd-term" class="font-semibold text-base capitalize">--</div>
            <div id="wotd-def" class="text-xs opacity-80 line-clamp-2 md:line-clamp-3 leading-snug">--</div>
        </div>

        <!-- Weather Widget for Up to 3 Locations -->
        <div id="weather-widget" class="hidden-ui pointer-events-auto glass p-3 md:p-4 rounded-2xl flex flex-col gap-2 md:gap-3 text-sm hidden w-full md:w-auto md:max-w-sm max-h-[35vh] md:max-h-[80vh] overflow-y-auto">
            <div id="weather-locations-container" class="flex flex-col gap-2 md:gap-3"></div>
        </div>
    </div>

    <main class="flex flex-col items-center justify-center min-h-full text-center px-4 select-none pt-52 pb-24 md:pt-0 md:pb-0">
        <div id="clock" class="text-6xl sm:text-7xl md:text-9xl font-semibold mb-2">00:00</div>
        <div id="greeting" class="text-2xl md:text-3xl font-light opacity-90 mb-4">Good morning.</div>
        <div id="custom-message" class="text-lg md:text-xl font-light opacity-80 mb-8 hidden"></div>

        <div id="quote-container" class="max-w-2xl transition-opacity duration-1000">
            <p id="quote-text" class="text-xl md:text-2xl font-light mb-2 italic">"Loading inspiration..."</p>
            <p id="quote-author" class="text-sm opacity-70 tracking-wide"></p>
        </div>
    </main>

    <!-- Bottom UI -->
    <div class="hidden-ui fixed bottom-6 left-6 flex items-center gap-3">
        <button id="settings-toggle" class="p-3 rounded-full glass hover:bg-white/20 transition-all" title="Settings">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.72V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.17a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button id="refresh-bg" class="p-3 rounded-full glass hover:bg-white/20 transition-all" title="New Image">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M3 21v-5h5"/></svg>
        </button>
        <div id="bg-loader" class="loader"></div>
    </div>

    <div id="photo-credit" class="hidden-ui fixed bottom-6 right-6 text-xs opacity-50 font-light text-right">
        Background: <span id="photographer">Unsplash</span>
    </div>

    <!-- Settings Panel -->
    <div id="settings-panel" class="fixed inset-0 bg-black/60 backdrop-blur-md z-50 flex items-center justify-center hidden opacity-0 transition-opacity duration-300 px-4">
        <div class="glass p-8 rounded-2xl w-full max-w-md shadow-2xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-semibold">Settings</h2>
                <button id="close-settings" class="p-2 hover:bg-white/10 rounded-full transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>

            <div class="space-y-4">
                <div class="setting-row">
                    <label class="text-sm opacity-80">Clock Format</label>
                    <select id="set-clock-format">
                        <option value="24">24-hour</option>
                        <option value="12">12-hour</option>
                    </select>
                </div>

                <div class="setting-row">
                    <label class="text-sm opacity-80">Show Seconds</label>
                    <input type="checkbox" id="set-show-seconds">
                </div>

                <div class="setting-row">
                    <label class="text-sm opacity-80">Font Theme</label>
                    <select id="set-font">
                        <option value="Inter">Modern (Sans)</option>
                        <option value="'Playfair Display'">Elegant (Serif)</option>
                        <option value="'JetBrains Mono'">Tech (Mono)</option>
                    </select>
                </div>

                <div class="setting-row">
                    <label class="text-sm opacity-80">Category</label>
                    <select id="set-category">
                        <option value="Featured">Featured</option>
                        <option value="Nature">Nature</option>
                        <option value="Architecture">Architecture</option>
                        <option value="Travel">Travel</option>
                        <option value="Custom">Custom</option>
                    </select>
                </div>

                <div class="setting-row" id="row-bg-query">
                    <label class="text-sm opacity-80">Image Keywords</label>
                    <input type="text" id="set-bg-query" placeholder="nature, architecture">
                </div>

                <div class="setting-row">
                    <label class="text-sm opacity-80">Your Name</label>
                    <input type="text" id="set-user-name" placeholder="Friend">
                </div>

                <div class="setting-row">
                    <label class="text-sm opacity-80">Custom Message</label>
                    <input type="text" id="set-custom-message" placeholder="Make today awesome">
                </div>

                <div class="setting-row">
                    <label class="text-sm opacity-80">Location 2 (Optional)</label>
                    <input type="text" id="set-weather-loc2" placeholder="e.g. London">
                </div>

                <div class="setting-row">
                    <label class="text-sm opacity-80">Location 3 (Optional)</label>
                    <input type="text" id="set-weather-loc3" placeholder="e.g. New York">
                </div>

                <div class="setting-row">
                    <label class="text-sm opacity-80">Weather Units</label>
                    <select id="set-weather-units">
                        <option value="c">Celsius (°C)</option>
                        <option value="f">Fahrenheit (°F)</option>
                    </select>
                </div>

                <div class="setting-row">
                    <label class="text-sm opacity-80">Weather Display</label>
                    <select id="set-weather-mode">
                        <option value="compact">Compact</option>
                        <option value="detailed">Detailed</option>
                    </select>
                </div>

                <div class="setting-row">
                    <label class="text-sm opacity-80">Word of the Day</label>
                    <input type="checkbox" id="set-show-wotd" checked>
                </div>

                <div class="setting-row">
                    <label class="text-sm opacity-80">Unsplash Access Key</label>
                    <input type="password" id="set-api-key" placeholder="Paste Access Key here">
                </div>

                <div class="mt-8 pt-6 border-t border-white/10">
                    <p class="text-[10px] opacity-40 uppercase tracking-widest mb-2 font-bold">Persistence URL</p>
                    <div class="flex gap-2">
                        <input id="sync-url" type="text" readonly class="text-xs flex-1 opacity-50 bg-black/20 font-mono" value="">
                        <button id="copy-url" class="text-xs px-3 py-1 bg-white/10 hover:bg-white/20 rounded transition-colors">Copy</button>
                    </div>
                    <p class="text-[10px] opacity-40 mt-2 italic">Save this URL to keep your settings across devices.</p>
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import {
            getWeatherIcon,
            convertCelsiusToFahrenheit,
            formatGreeting,
            parseURLState,
            serializeURLState,
            buildWeatherLocationsList,
            formatHourlyTime,
            resolveBackgroundKeywords,
            parseCoordinateQuery,
            extractDailySummary,
            getDailyWordFromList
        } from './src/app-core.js';

        // Initial Defaults
        let state = {
            format: '24',
            seconds: false,
            font: 'Inter',
            category: 'Featured',
            bg: 'nature,landscape',
            name: '',
            message: '',
            loc: '',
            loc2: '',
            loc3: '',
            units: 'c',
            wMode: 'compact',
            wotd: true,
            apiKey: '',
            seed: Math.floor(Math.random() * 1000)
        };

        // DOM Elements
        const elClock = document.getElementById('clock');
        const elGreeting = document.getElementById('greeting');
        const elCustomMessage = document.getElementById('custom-message');
        const elQuoteText = document.getElementById('quote-text');
        const elQuoteAuthor = document.getElementById('quote-author');
        const elBg = document.getElementById('bg-overlay');
        const elPhotographer = document.getElementById('photographer');
        const elBgLoader = document.getElementById('bg-loader');
        const panel = document.getElementById('settings-panel');
        const syncInput = document.getElementById('sync-url');

        function loadSettings() {
            const hasParams = window.location.search.length > 1;

            if (hasParams) {
                const parsed = parseURLState(window.location.search);
                state = { ...state, ...parsed };
                try { localStorage.setItem('batliss-settings', JSON.stringify(state)); } catch {}
            } else {
                try {
                    const savedSettings = localStorage.getItem('batliss-settings');
                    if (savedSettings) {
                        const parsed = JSON.parse(savedSettings);
                        state = { ...state, ...parsed };
                    }
                } catch {}
            }

            document.body.style.fontFamily = state.font + ", sans-serif";

            document.getElementById('set-clock-format').value = state.format;
            document.getElementById('set-show-seconds').checked = state.seconds;
            document.getElementById('set-font').value = state.font;
            document.getElementById('set-category').value = state.category;
            document.getElementById('set-bg-query').value = state.bg;
            document.getElementById('set-user-name').value = state.name || '';
            document.getElementById('set-custom-message').value = state.message || '';
            document.getElementById('set-weather-loc2').value = state.loc2 || '';
            document.getElementById('set-weather-loc3').value = state.loc3 || '';
            document.getElementById('set-weather-units').value = state.units || 'c';
            document.getElementById('set-weather-mode').value = state.wMode || 'compact';
            document.getElementById('set-show-wotd').checked = state.wotd !== false;
            document.getElementById('set-api-key').value = state.apiKey || '';

            updateKeywordVisibility();
            updateCustomMessage();
            updateSyncURL(true);
            fetchWeather();
            fetchWotd();
        }

        function updateKeywordVisibility() {
            const elRowBgQuery = document.getElementById('row-bg-query');
            if (state.category === 'Custom') {
                elRowBgQuery.classList.remove('hidden');
            } else {
                elRowBgQuery.classList.add('hidden');
            }
        }

        function updateCustomMessage() {
            if (state.message && state.message.trim() !== '') {
                elCustomMessage.textContent = state.message;
                elCustomMessage.classList.remove('hidden');
            } else {
                elCustomMessage.textContent = '';
                elCustomMessage.classList.add('hidden');
            }
        }

        async function resolveInferredLocation() {
            const GEO_CACHE_KEY = 'batliss-cached-geo';
            const GEO_CACHE_TTL = 3600000; // 1 hour TTL

            try {
                const cachedStr = localStorage.getItem(GEO_CACHE_KEY);
                if (cachedStr) {
                    const cached = JSON.parse(cachedStr);
                    if (cached && cached.lat && cached.lon && (Date.now() - cached.timestamp < GEO_CACHE_TTL)) {
                        return { lat: cached.lat, lon: cached.lon, locName: cached.locName || 'Local' };
                    }
                }
            } catch {}

            // Tier 1: ipwho.is (CORS enabled, keyless)
            try {
                const res = await fetch('https://ipwho.is/');
                if (res.ok) {
                    const data = await res.json();
                    if (data.success !== false && data.latitude && data.longitude) {
                        const geo = { lat: data.latitude, lon: data.longitude, locName: data.city || 'Local', timestamp: Date.now() };
                        try { localStorage.setItem(GEO_CACHE_KEY, JSON.stringify(geo)); } catch {}
                        return geo;
                    }
                }
            } catch {}

            // Tier 2: freeipapi.com (CORS enabled, keyless)
            try {
                const res = await fetch('https://freeipapi.com/api/json');
                if (res.ok) {
                    const data = await res.json();
                    if (data.latitude && data.longitude) {
                        const geo = { lat: data.latitude, lon: data.longitude, locName: data.cityName || 'Local', timestamp: Date.now() };
                        try { localStorage.setItem(GEO_CACHE_KEY, JSON.stringify(geo)); } catch {}
                        return geo;
                    }
                }
            } catch {}

            // Tier 3: ipapi.co (Fallback)
            try {
                const res = await fetch('https://ipapi.co/json/');
                if (res.ok) {
                    const data = await res.json();
                    if (data.latitude && data.longitude) {
                        const geo = { lat: data.latitude, lon: data.longitude, locName: data.city || 'Local', timestamp: Date.now() };
                        try { localStorage.setItem(GEO_CACHE_KEY, JSON.stringify(geo)); } catch {}
                        return geo;
                    }
                }
            } catch {}

            throw new Error('All IP geolocation tiers failed');
        }

        async function fetchWeather() {
            const widget = document.getElementById('weather-widget');
            const container = document.getElementById('weather-locations-container');
            container.replaceChildren();

            const locations = buildWeatherLocationsList(state);
            let cardCount = 0;

            for (const locItem of locations) {
                try {
                    let lat, lon, locName;
                    if (locItem.query !== '') {
                        const coord = parseCoordinateQuery(locItem.query);
                        if (coord) {
                            lat = coord.lat;
                            lon = coord.lon;
                            locName = `${lat.toFixed(2)}, ${lon.toFixed(2)}`;
                        } else {
                            const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(locItem.query)}&count=1&language=en&format=json`);
                            if (!geoRes.ok) throw new Error('Geocoding failed');
                            const geoData = await geoRes.json();
                            if (!geoData.results || geoData.results.length === 0) throw new Error('Location not found');
                            const result = geoData.results[0];
                            lat = result.latitude;
                            lon = result.longitude;
                            locName = result.name;
                        }
                    } else {
                        const inferred = await resolveInferredLocation();
                        lat = inferred.lat;
                        lon = inferred.lon;
                        locName = inferred.locName;
                    }

                    const weatherRes = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current_weather=true&hourly=temperature_2m,weathercode&daily=temperature_2m_max,temperature_2m_min,precipitation_probability_max,uv_index_max&forecast_days=1&timezone=auto`);
                    if (!weatherRes.ok) throw new Error('Weather API error');
                    const weatherData = await weatherRes.json();

                    const curr = weatherData.current_weather;
                    const daily = weatherData.daily || {};
                    const hourly = weatherData.hourly || {};

                    let rawTemp = curr.temperature;
                    let unitSymbol = '°C';
                    if (state.units === 'f') {
                        rawTemp = convertCelsiusToFahrenheit(rawTemp);
                        unitSymbol = '°F';
                    }

                    const tempDisplay = `${Math.round(rawTemp)}${unitSymbol}`;
                    const icon = getWeatherIcon(curr.weathercode);
                    const summary = extractDailySummary(daily, state.units);

                    let detailsParts = [];
                    if (summary.detailsStr) detailsParts.push(summary.detailsStr);
                    if (curr.windspeed !== undefined) detailsParts.push(`💨 ${Math.round(curr.windspeed)} km/h`);
                    const detailsStr = detailsParts.join(' · ');

                    // Imperative DOM Construction (XSS-Safe)
                    const itemDiv = document.createElement('div');
                    itemDiv.className = 'weather-location-item border-b border-white/10 pb-3 last:border-0 last:pb-0';

                    const headerDiv = document.createElement('div');
                    headerDiv.className = 'flex items-center gap-3';

                    const iconSpan = document.createElement('span');
                    iconSpan.className = 'text-2xl';
                    iconSpan.textContent = icon;
                    headerDiv.appendChild(iconSpan);

                    const textContainer = document.createElement('div');
                    textContainer.className = 'text-left';

                    const titleDiv = document.createElement('div');
                    titleDiv.className = 'font-medium text-sm';
                    titleDiv.textContent = `${locName} ${tempDisplay}${summary.highLowText}`;
                    textContainer.appendChild(titleDiv);

                    if (detailsStr) {
                        const detailsDiv = document.createElement('div');
                        detailsDiv.className = 'text-[11px] opacity-70 mt-0.5';
                        detailsDiv.textContent = detailsStr;
                        textContainer.appendChild(detailsDiv);
                    }

                    headerDiv.appendChild(textContainer);
                    itemDiv.appendChild(headerDiv);

                    // Hourly Strip (XSS-Safe)
                    if (state.wMode === 'detailed' && hourly.time && hourly.temperature_2m) {
                        const hourlyContainer = document.createElement('div');
                        hourlyContainer.className = 'flex gap-1.5 overflow-x-auto pt-2 mt-2 border-t border-white/10 text-[10px] select-none scrollbar-none';
                        let pillCount = 0;

                        for (let i = 0; i < hourly.time.length && pillCount < 8; i += 2) {
                            const timeStr = hourly.time[i];
                            const hourVal = parseInt(timeStr.split('T')[1].split(':')[0], 10);
                            let hTemp = hourly.temperature_2m[i];
                            if (state.units === 'f') hTemp = convertCelsiusToFahrenheit(hTemp);
                            const hIcon = getWeatherIcon(hourly.weathercode ? hourly.weathercode[i] : 0);
                            const displayHour = formatHourlyTime(hourVal, state.format);

                            const pill = document.createElement('div');
                            pill.className = 'flex flex-col items-center min-w-[34px] glass px-1.5 py-1 rounded';

                            const hourSpan = document.createElement('span');
                            hourSpan.className = 'opacity-70';
                            hourSpan.textContent = displayHour;

                            const iconEl = document.createElement('span');
                            iconEl.textContent = hIcon;

                            const tempSpan = document.createElement('span');
                            tempSpan.className = 'font-medium';
                            tempSpan.textContent = `${Math.round(hTemp)}°`;

                            pill.appendChild(hourSpan);
                            pill.appendChild(iconEl);
                            pill.appendChild(tempSpan);
                            hourlyContainer.appendChild(pill);
                            pillCount++;
                        }

                        if (pillCount > 0) {
                            itemDiv.appendChild(hourlyContainer);
                        }
                    }

                    container.appendChild(itemDiv);
                    cardCount++;
                } catch (err) {
                    console.warn(`Weather fetch error for location ${locItem.query}:`, err.message);
                }
            }

            if (cardCount > 0) {
                widget.classList.remove('hidden');
            } else {
                widget.classList.add('hidden');
            }
        }

        let wordsDatabase = [];

        async function loadWordsDatabase() {
            if (wordsDatabase.length > 0) return wordsDatabase;
            try {
                const res = await fetch('words.json');
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                wordsDatabase = await res.json();
            } catch (err) {
                console.warn('Failed to load words.json, using fallback:', err.message);
                wordsDatabase = [
                    {
                        w: 'serendipity',
                        p: 'noun',
                        pr: '/ˌsɛɹənˈdɪpɪti/',
                        d: 'The faculty of making fortunate discoveries by accident.',
                        e: 'Coined by Horace Walpole in 1754 from Serendip.',
                        u: 'https://en.wiktionary.org/wiki/serendipity'
                    }
                ];
            }
            return wordsDatabase;
        }

        async function fetchWotd() {
            const widget = document.getElementById('wotd-widget');
            const termEl = document.getElementById('wotd-term');
            const defEl = document.getElementById('wotd-def');
            const linkEl = document.getElementById('wotd-link');

            if (state.wotd === false) {
                widget.classList.add('hidden');
                return;
            }

            const words = await loadWordsDatabase();
            const todayWord = getDailyWordFromList(words, new Date());

            if (!todayWord) {
                widget.classList.add('hidden');
                return;
            }

            termEl.textContent = todayWord.w;

            const metaParts = [];
            if (todayWord.p) metaParts.push(todayWord.p);
            if (todayWord.pr) metaParts.push(todayWord.pr);

            const prefix = metaParts.length > 0 ? `(${metaParts.join(' · ')}) ` : '';
            defEl.textContent = `${prefix}${todayWord.d}`;

            if (todayWord.e) {
                defEl.title = `Etymology: ${todayWord.e}`;
            } else {
                defEl.removeAttribute('title');
            }

            linkEl.href = todayWord.u || `https://en.wiktionary.org/wiki/${encodeURIComponent(todayWord.w)}`;
            widget.classList.remove('hidden');
        }

        function updateSyncURL(isInitial = false) {
            const newSearch = `?${serializeURLState(state)}`;
            syncInput.value = window.location.origin + window.location.pathname + newSearch;

            try {
                window.history.replaceState({}, '', newSearch);
            } catch (e) {
                if (!isInitial) console.warn("History API restricted.");
            }
        }

        function updateClock() {
            const now = new Date();
            let hours = now.getHours();
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            let ampm = '';
            if (state.format === '12') {
                ampm = hours >= 12 ? ' PM' : ' AM';
                hours = hours % 12 || 12;
            }

            elClock.textContent = `${hours}:${minutes}${state.seconds ? ':' + seconds : ''}${ampm}`;

            let greet = "Good night";
            if (now.getHours() < 12) greet = "Good morning";
            else if (now.getHours() < 18) greet = "Good afternoon";
            else if (now.getHours() < 22) greet = "Good evening";

            elGreeting.textContent = `${greet}${state.name ? ', ' + state.name : ''}.`;
        }

        /**
         * fetchBackground 
         * Uses official Unsplash API if key is provided.
         */
        async function fetchBackground() {
            elBgLoader.style.display = 'block';

            if (!state.apiKey) {
                console.warn("Unsplash API Key missing. Using fallback.");
                useFallbackBackground();
                return;
            }

            let keywords = state.bg || 'nature,landscape';
            if (state.category && state.category !== 'Custom') {
                keywords = state.category.toLowerCase();
            }

            const query = encodeURIComponent(keywords.replace(/,/g, ' '));
            const apiUrl = `https://api.unsplash.com/photos/random?query=${query}&client_id=${state.apiKey}`;

            try {
                const response = await fetch(apiUrl);
                if (!response.ok) throw new Error(`API error: ${response.status}`);
                const photo = await response.json();

                const imageUrl = `${photo.urls.regular}&w=${window.innerWidth}&q=80&auto=format`;

                const img = new Image();
                img.src = imageUrl;
                img.onload = () => {
                    elBg.style.backgroundImage = `url('${imageUrl}')`;
                    elBg.style.opacity = 1;
                    elBgLoader.style.display = 'none';

                    elPhotographer.replaceChildren();
                    elPhotographer.appendChild(document.createTextNode('Photo by '));
                    const userLink = document.createElement('a');
                    userLink.href = `${photo.user.links.html}?utm_source=batliss&utm_medium=referral`;
                    userLink.target = '_blank';
                    userLink.className = 'underline';
                    userLink.textContent = photo.user.name;
                    elPhotographer.appendChild(userLink);

                    elPhotographer.appendChild(document.createTextNode(' on '));
                    const unsplashLink = document.createElement('a');
                    unsplashLink.href = 'https://unsplash.com/?utm_source=batliss&utm_medium=referral';
                    unsplashLink.target = '_blank';
                    unsplashLink.className = 'underline';
                    unsplashLink.textContent = 'Unsplash';
                    elPhotographer.appendChild(unsplashLink);
                };
            } catch (err) {
                console.error("Unsplash API failed:", err);
                useFallbackBackground();
            }
        }

        function useFallbackBackground() {
            const randomSeed = Math.floor(Math.random() * 1000);
            const fallbackUrl = `https://picsum.photos/seed/${randomSeed}/1920/1080`;
            const img = new Image();
            img.src = fallbackUrl;
            img.onload = () => {
                elBg.style.backgroundImage = `url('${fallbackUrl}')`;
                elBg.style.opacity = 1;
                elBgLoader.style.display = 'none';
                elPhotographer.textContent = "Picsum Photos (Keyless Fallback)";
            };
            img.onerror = () => {
                const staticUrl = "https://images.unsplash.com/photo-1470770841072-f978cf4d019e?auto=format&fit=crop&w=1920&q=80";
                elBg.style.backgroundImage = `url('${staticUrl}')`;
                elBg.style.opacity = 1;
                elBgLoader.style.display = 'none';
                elPhotographer.textContent = "Unsplash (Static Fallback)";
            };
        }

        let quotes = [];

        async function loadQuotes() {
            try {
                const response = await fetch('quotes.json');
                quotes = await response.json();
                displayRandomQuote();
            } catch (error) {
                console.error("Failed to load quotes:", error);
                // Fallback quote
                elQuoteText.textContent = '"Act as if what you do makes a difference. It does."';
                elQuoteAuthor.textContent = "— William James";
            }
        }

        function displayRandomQuote() {
            if (quotes.length === 0) return;
            const randomIndex = Math.floor(Math.random() * quotes.length);
            const quote = quotes[randomIndex];
            elQuoteText.textContent = `"${quote.c}"`;
            elQuoteAuthor.textContent = `— ${quote.a}${quote.s ? ', ' + quote.s : ''}`;
        }

        // Interaction
        document.getElementById('settings-toggle').onclick = () => {
            panel.classList.remove('hidden');
            setTimeout(() => panel.classList.add('opacity-100'), 10);
        };

        document.getElementById('close-settings').onclick = () => {
            panel.classList.remove('opacity-100');
            setTimeout(() => panel.classList.add('hidden'), 300);
        };

        document.getElementById('refresh-bg').onclick = () => {
            fetchBackground();
        };

        document.querySelectorAll('input, select').forEach(el => {
            el.onchange = (e) => {
                const id = e.target.id;
                const val = e.target.type === 'checkbox' ? e.target.checked : e.target.value;

                if (id === 'set-clock-format') state.format = val;
                if (id === 'set-show-seconds') state.seconds = val;
                if (id === 'set-font') {
                    state.font = val;
                    document.body.style.fontFamily = val + ", sans-serif";
                }
                if (id === 'set-bg-query') state.bg = val;
                if (id === 'set-category') {
                    state.category = val;
                    updateKeywordVisibility();
                    fetchBackground();
                }
                if (id === 'set-user-name') state.name = val;
                if (id === 'set-custom-message') {
                    state.message = val;
                    updateCustomMessage();
                }
                if (id === 'set-weather-loc2') {
                    state.loc2 = val;
                    fetchWeather();
                }
                if (id === 'set-weather-loc3') {
                    state.loc3 = val;
                    fetchWeather();
                }
                if (id === 'set-weather-units') {
                    state.units = val;
                    fetchWeather();
                }
                if (id === 'set-weather-mode') {
                    state.wMode = val;
                    fetchWeather();
                }
                if (id === 'set-show-wotd') {
                    state.wotd = val;
                    fetchWotd();
                }
                if (id === 'set-api-key') {
                    state.apiKey = val;
                    fetchBackground();
                }

                updateSyncURL();
                updateClock();
                localStorage.setItem('batliss-settings', JSON.stringify(state));
            };
        });

        document.getElementById('copy-url').onclick = async () => {
            const btn = document.getElementById('copy-url');
            try {
                if (navigator.clipboard && navigator.clipboard.writeText) {
                    await navigator.clipboard.writeText(syncInput.value);
                } else {
                    syncInput.select();
                    document.execCommand('copy');
                }
                btn.textContent = 'Copied!';
            } catch (err) {
                console.warn('Clipboard copy failed:', err);
                syncInput.select();
                document.execCommand('copy');
                btn.textContent = 'Copied!';
            }
            setTimeout(() => btn.textContent = 'Copy', 2000);
        };

        // Click or tap anywhere outside widgets to toggle UI visibility
        document.addEventListener('click', (e) => {
            if (e.target.closest('#settings-panel') || e.target.closest('#wotd-widget') || e.target.closest('#weather-widget') || e.target.closest('button') || e.target.closest('a') || e.target.closest('input') || e.target.closest('select')) {
                return;
            }
            document.body.classList.toggle('ui-hidden');
        });

        window.onload = () => {
            loadSettings();
            updateClock();
            fetchBackground();
            loadQuotes();
            setInterval(updateClock, 1000);

            // Register Service Worker for PWA
            if ('serviceWorker' in navigator) {
                navigator.serviceWorker.register('sw.js').then(registration => {
                    console.log('SW registered: ', registration);
                }).catch(registrationError => {
                    console.log('SW registration failed: ', registrationError);
                });
            }
        };
    </script>
</body>
</html>
